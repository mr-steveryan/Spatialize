name: Spatialize
options:
  deploymentTarget:
    macOS: "14.2"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Spatialize:
    type: application
    platform: macOS
    sources:
      - Spatialize
      - path: waveform.icns
        buildPhase: resources
    info:
      path: Spatialize/Info.plist
      properties:
        CFBundleDisplayName: Spatialize
        CFBundleIconFile: waveform
        LSUIElement: true
        NSAudioCaptureUsageDescription: Spatialize captures Spotify's audio to play it back with spatial sound.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrsteve.spatialize
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          # Keep the debugger entitlement (get-task-allow) out of shipped builds.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  SpatializeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SpatializeTests]
    dependencies:
      - target: Spatialize
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrsteve.spatialize.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Spatialize:
    build:
      targets:
        Spatialize: all
    test:
      targets: [SpatializeTests]
